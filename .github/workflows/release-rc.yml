name: Release / RC

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prerelease:
    name: Create RC pre-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next RC version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --force --tags

          latest="$(
            git tag -l 'v0.1.*-RC1' --sort=-v:refname \
              | grep -E '^v0\.1\.[0-9]+-RC1$' \
              | head -n 1 \
              || true
          )"

          if [[ -z "$latest" ]]; then
            next="v0.1.0-RC1"
          else
            patch="${latest#v0.1.}"
            patch="${patch%-RC1}"
            next="v0.1.$((10#$patch + 1))-RC1"
          fi

          printf 'Última RC: %s\n' "${latest:-nenhuma}"
          printf 'Próxima RC: %s\n' "$next"
          printf 'tag=%s\n' "$next" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --prerelease
