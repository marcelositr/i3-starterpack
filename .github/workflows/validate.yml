name: CI / Quick

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate essentials
        run: ./script/validate-quick
