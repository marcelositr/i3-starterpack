name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes i3-wm libxml2-utils shellcheck

      - name: Validate files
        run: ./script/validate
